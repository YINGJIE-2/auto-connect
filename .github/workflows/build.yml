name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 编译
        run: go build -trimpath -ldflags "-s -w" -o auto-connect.exe .

      - name: 查看产物大小
        run: Get-Item auto-connect.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: auto-connect-windows-amd64
          path: auto-connect.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: auto-connect.exe
          generate_release_notes: true
